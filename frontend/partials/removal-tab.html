<div class="space-y-6">
    <div class="card">
        <!-- Heading -->
        <div class="flex flex-wrap justify-between items-start gap-4 mb-5">
            <div>
                <div class="flex items-center gap-3">
                    <h2 class="page-title">Remove media</h2>
                    <span x-show="loadingCandidates && candidates" x-cloak class="inline-flex items-center gap-1.5 text-sm font-medium text-primary-600 dark:text-primary-400">
                        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                        Updating&hellip;
                    </span>
                </div>
                <p class="page-subtitle" x-show="candidates" x-cloak>
                    <span class="num" x-text="candidates?.length || 0"></span> candidates &middot;
                    <span class="num" x-text="formatFileSize(candidateStats().total)"></span> reclaimable
                </p>
            </div>
            <div class="flex items-center gap-3">
                <span x-show="candidatesAt && candidates" x-cloak class="text-xs text-gray-400 dark:text-gray-500" x-text="'Updated ' + timeAgo(candidatesAt)"></span>
                <button @click="loadCandidates" :disabled="loading" class="btn-secondary text-sm">
                    <svg class="w-4 h-4 mr-2" :class="loadingCandidates ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Refresh
                </button>
            </div>
        </div>

        <!-- Active filters -->
        <template x-if="config">
            <div class="flex flex-wrap items-center gap-x-2 gap-y-1 px-4 py-2.5 mb-5 rounded-lg bg-gray-50 dark:bg-gray-800/50 border border-gray-200/70 dark:border-gray-800 text-sm text-gray-500 dark:text-gray-400">
                <span class="eyebrow mr-1">Filters</span>
                <span class="px-2 py-0.5 rounded-md bg-white dark:bg-gray-800 text-xs font-medium text-gray-700 dark:text-gray-300 ring-1 ring-gray-200 dark:ring-gray-700"
                      x-text="mediaType === 'both' ? 'Movies + TV' : (mediaType === 'movies' ? 'Movies' : 'TV')"></span>
                <span>not played in <span class="num" x-text="config.media.days_unwatched"></span>d</span>
                <span x-show="config.media.max_play_count === 1">&middot; never watched</span>
                <span x-show="config.media.max_play_count > 1">&middot; watched &lt; <span class="num" x-text="config.media.max_play_count"></span>&times;</span>
                <span x-show="config.safety.dry_run" class="text-amber-600 dark:text-amber-400">&middot; dry run (config)</span>
                <button @click="openFilters()" class="font-medium text-primary-600 dark:text-primary-400 hover:underline ml-auto">Edit filters &rarr;</button>
            </div>
        </template>

        <template x-if="loadingCandidates && !candidates">
            <div class="text-center py-12">
                <svg class="animate-spin mx-auto h-8 w-8 text-primary-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                <p class="text-gray-600 dark:text-gray-400 mt-4">Finding removal candidates&hellip;</p>
            </div>
        </template>

        <template x-if="!loadingCandidates && !candidates">
            <p class="text-center py-12 text-gray-600 dark:text-gray-400">No candidates loaded. Click Refresh to see what would be removed.</p>
        </template>

        <template x-if="candidates && candidates.length === 0">
            <div class="text-center py-12">
                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p class="text-gray-600 dark:text-gray-400 mt-4">Nothing matches the current filters.</p>
            </div>
        </template>

        <template x-if="candidates && candidates.length > 0">
            <div class="transition-opacity duration-200" :class="loadingCandidates ? 'opacity-40 pointer-events-none' : ''">
                <div class="mb-4 flex items-center gap-2">
                    <input type="text" x-model="searchQuery" placeholder="Search titles..." class="input-field flex-1">
                    <!-- Column picker -->
                    <div class="relative flex-shrink-0" @keydown.escape.window="columnMenuOpen = false">
                        <button @click="columnMenuOpen = !columnMenuOpen" :aria-expanded="columnMenuOpen" aria-label="Choose columns"
                                :title="`Columns (${shownColumns().length} of ${removalColumns.length} shown)`"
                                class="relative p-2.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 transition focus:outline-none focus:ring-2 focus:ring-primary-500"
                                :class="columnMenuOpen ? 'text-primary-600 dark:text-primary-400' : 'text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200'">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 4.5v15m6-15v15M4.5 4.5h15a1 1 0 011 1v13a1 1 0 01-1 1h-15a1 1 0 01-1-1v-13a1 1 0 011-1z"></path>
                            </svg>
                            <span x-show="!columnsAreDefault()" x-cloak class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-primary-500 ring-2 ring-white dark:ring-gray-900"></span>
                        </button>
                        <div x-show="columnMenuOpen" x-cloak @click.outside="columnMenuOpen = false"
                             x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                             x-transition:leave="transition ease-in duration-75" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
                             class="absolute right-0 mt-2 w-52 origin-top-right z-30 rounded-xl shadow-xl border bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700 py-2">
                            <div class="px-4 pb-2 eyebrow">Show columns</div>
                            <template x-for="col in removalColumns" :key="col.key">
                                <label class="flex items-center gap-3 px-4 py-1.5 text-sm text-gray-700 dark:text-gray-200 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700/50">
                                    <input type="checkbox" :checked="colOn(col.key)" @change="toggleColumn(col.key)"
                                           class="rounded border-gray-300 dark:border-gray-600 dark:bg-gray-800 text-primary-600 focus:ring-primary-500">
                                    <span x-text="col.label"></span>
                                </label>
                            </template>
                            <div class="mt-1 pt-2 px-4 border-t border-gray-100 dark:border-gray-700">
                                <button @click="resetColumns()" :disabled="columnsAreDefault()"
                                        class="text-xs font-medium text-primary-600 dark:text-primary-400 hover:underline disabled:opacity-40 disabled:no-underline disabled:cursor-default">Reset to default</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Candidates table: header sticks under the app bar while scrolling -->
                <div class="overflow-x-auto md:overflow-visible -mx-2 px-2">
                    <table class="min-w-full">
                        <thead class="md:sticky md:top-16 z-20 bg-white/95 dark:bg-gray-900/95 backdrop-blur">
                            <tr class="border-b border-gray-200 dark:border-gray-700">
                                <th class="pl-3 pr-2 py-3 text-left w-8">
                                    <input type="checkbox" @click="toggleSelectAll()"
                                           :checked="selectedCandidates.length > 0 && selectedCandidates.length >= Math.min(filteredCandidates().length, selectionLimit())"
                                           :title="filteredCandidates().length > selectionLimit() ? `Select the first ${selectionLimit()} (max per removal)` : 'Select all'"
                                           class="rounded border-gray-300 dark:border-gray-600 dark:bg-gray-800 text-primary-600 focus:ring-primary-500">
                                </th>
                                <template x-for="col in [{key: 'title', label: 'Title', cls: 'w-[45%]'}, ...shownColumns()]" :key="col.key">
                                    <th @click="sortBy(col.key)" :class="col.cls"
                                        class="px-3 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider cursor-pointer select-none hover:text-gray-800 dark:hover:text-gray-200">
                                        <span class="inline-flex items-center gap-1">
                                            <span x-text="col.label"></span>
                                            <svg class="w-3.5 h-3.5" :class="sortColumn === col.key ? 'text-primary-600 dark:text-primary-400' : 'text-gray-300 dark:text-gray-600'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" :d="sortColumn === col.key && sortDirection === 'desc' ? 'M19 9l-7 7-7-7' : 'M5 15l7-7 7 7'"></path>
                                            </svg>
                                        </span>
                                    </th>
                                </template>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
                            <template x-for="item in filteredCandidates()" :key="item.id">
                                <tr class="cursor-pointer transition-colors"
                                    :class="isSelected(item.id) ? 'bg-primary-50/70 dark:bg-primary-900/15' : 'hover:bg-gray-50 dark:hover:bg-gray-800/50'"
                                    @click="toggleSelection(item.id)">
                                    <td class="pl-3 pr-2 py-2">
                                        <input type="checkbox" :checked="isSelected(item.id)" @click.stop.prevent="toggleSelection(item.id)"
                                               :class="!isSelected(item.id) && atSelectionLimit() ? 'opacity-40 cursor-not-allowed' : ''"
                                               class="rounded border-gray-300 dark:border-gray-600 dark:bg-gray-800 text-primary-600 focus:ring-primary-500">
                                    </td>
                                    <td class="px-3 py-2">
                                        <div class="flex items-center gap-3 min-w-0">
                                            {{> poster}}
                                            <div class="min-w-0">
                                                <div class="text-sm font-medium text-gray-900 dark:text-white truncate" x-text="item.title"></div>
                                                <div class="text-xs text-gray-500 dark:text-gray-400">
                                                    <span x-text="item.year || ''"></span>
                                                    <span class="sm:hidden" x-text="mobileMeta(item)"></span>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                    <td x-show="colOn('last_played')" class="hidden sm:table-cell px-3 py-2 whitespace-nowrap text-sm"
                                        :class="item.last_played ? 'text-gray-700 dark:text-gray-300' : 'text-gray-400 dark:text-gray-500'"
                                        x-text="formatDate(item.last_played)"></td>
                                    <td x-show="colOn('play_count')" class="hidden sm:table-cell px-3 py-2 whitespace-nowrap text-sm num"
                                        :class="item.play_count ? 'text-gray-700 dark:text-gray-300' : 'text-gray-400 dark:text-gray-500'"
                                        x-text="item.play_count || 0"></td>
                                    <td x-show="colOn('added_at')" class="hidden sm:table-cell px-3 py-2 whitespace-nowrap text-sm text-gray-700 dark:text-gray-300"
                                        :title="formatDay(item.added_at)" x-text="formatAge(item.added_at) || '—'"></td>
                                    <td x-show="colOn('quality')" class="hidden sm:table-cell px-3 py-2 whitespace-nowrap text-sm" :title="item.quality?.detail || ''">
                                        <template x-if="item.quality">
                                            <span class="inline-flex items-center gap-1.5">
                                                <span class="text-gray-700 dark:text-gray-300" x-text="item.quality.label"></span>
                                                <span x-show="item.quality.hdr" class="px-1.5 py-px rounded text-[10px] font-semibold tracking-wide"
                                                      :class="item.quality.hdr === 'DV' ? 'bg-fuchsia-100 text-fuchsia-700 dark:bg-fuchsia-900/30 dark:text-fuchsia-300' : 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300'"
                                                      x-text="item.quality.hdr"></span>
                                                <span x-show="item.quality.mixed" class="px-1.5 py-px rounded text-[10px] font-medium bg-gray-100 text-gray-500 dark:bg-gray-800 dark:text-gray-400">mixed</span>
                                            </span>
                                        </template>
                                        <span x-show="!item.quality" class="text-gray-400 dark:text-gray-500">—</span>
                                    </td>
                                    <td x-show="colOn('library_type')" class="hidden md:table-cell px-3 py-2 whitespace-nowrap">
                                        <span class="px-2 py-0.5 text-xs font-medium rounded-full"
                                              :class="item.library_type === 'movie' ? 'bg-sky-100 text-sky-800 dark:bg-sky-900/30 dark:text-sky-300' : 'bg-violet-100 text-violet-800 dark:bg-violet-900/30 dark:text-violet-300'"
                                              x-text="item.library_type === 'movie' ? 'Movie' : 'Show'"></span>
                                    </td>
                                    <td x-show="colOn('file_size')" class="hidden sm:table-cell px-3 py-2 whitespace-nowrap text-right w-36">
                                        <div class="num text-sm text-gray-900 dark:text-white" x-text="formatFileSize(item.file_size)"></div>
                                        <div class="mt-1 h-1 rounded-full bg-gray-100 dark:bg-gray-800 overflow-hidden">
                                            <div class="h-full rounded-full bg-primary-500/70 ml-auto" :style="`width:${sizePct(item.file_size)}%`"></div>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </template>
    </div>

    <!-- Selection bar: slides up while anything is selected -->
    <div x-show="currentTab === 'removal' && selectedCandidates.length > 0 && !dialog.open && !removalJob" x-cloak
         x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-4"
         class="fixed inset-x-0 bottom-4 z-40 px-4 pointer-events-none">
        <div class="pointer-events-auto mx-auto max-w-3xl rounded-xl shadow-2xl border bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700 overflow-hidden">
            <!-- Expanded: what's selected, biggest first -->
            <div x-show="selectionOpen" x-transition.opacity.duration.150ms class="border-b border-gray-200 dark:border-gray-700">
                <ul class="max-h-72 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-700/60">
                    <template x-for="item in selectionOpen ? selectedItems() : []" :key="item.id">
                        <li class="flex items-center gap-3 px-5 py-2">
                            {{> poster}}
                            <div class="min-w-0 flex-1">
                                <div class="text-sm text-gray-900 dark:text-white truncate" x-text="titleWithYear(item)"></div>
                                <div class="text-xs text-gray-500 dark:text-gray-400">
                                    <span x-text="item.library_type === 'movie' ? 'Movie' : 'Show'"></span> &middot;
                                    <span x-text="item.last_played ? 'watched ' + formatDate(item.last_played) : 'never watched'"></span>
                                </div>
                            </div>
                            <span class="num text-sm text-gray-700 dark:text-gray-300" x-text="formatFileSize(item.file_size)"></span>
                            <button @click="toggleSelection(item.id)" title="Unselect" aria-label="Unselect"
                                    class="p-1 rounded-md text-gray-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-900/30 transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </li>
                    </template>
                </ul>
            </div>
            <div class="flex flex-wrap items-center gap-x-4 gap-y-2 px-5 py-3">
            <button @click="selectionOpen = !selectionOpen" class="inline-flex items-center gap-1.5 text-sm group" :aria-expanded="selectionOpen" :title="selectionOpen ? 'Hide selection' : 'Show selection'">
                <svg class="w-4 h-4 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-200 transition-transform" :class="selectionOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                <span class="num font-semibold text-gray-900 dark:text-white" x-text="selectedCandidates.length"></span>
                <span class="text-gray-500 dark:text-gray-400">
                    <span x-show="selectionLimit() !== Infinity" x-text="'of max ' + selectionLimit() + ' '"></span>selected &middot;</span>
                <span class="num font-semibold text-gray-900 dark:text-white" x-text="formatFileSize(selectedBytes())"></span>
            </button>
            <button @click="selectedCandidates = []; selectionOpen = false" class="text-sm font-medium text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200">Clear</button>
            <button @click="reviewRemoval()" :disabled="loading"
                    class="ml-auto btn-danger">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
                <span x-text="(config?.safety?.dry_run ? 'Simulate' : 'Remove') + ' (' + selectedCandidates.length + ')'"></span>
            </button>
            </div>
        </div>
    </div>

    <!-- Removal progress (follows the background job; shown on every tab) -->
    <template x-teleport="body">
        <div x-show="removalJob" x-cloak x-transition.opacity
             class="fixed inset-x-0 bottom-4 z-40 px-4 pointer-events-none">
            <div class="pointer-events-auto mx-auto max-w-3xl px-5 py-4 rounded-xl shadow-2xl border bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700">
                <div class="flex items-center gap-3 text-sm">
                    <svg x-show="removalJob?.running" class="animate-spin h-4 w-4 text-rose-500 flex-shrink-0" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                    <svg x-show="removalJob && !removalJob.running" class="h-4 w-4 flex-shrink-0" :class="removalJob?.failed?.length ? 'text-amber-500' : 'text-emerald-500'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                    <span class="font-semibold text-gray-900 dark:text-white"
                          x-text="removalJob?.running ? (removalJob?.dry_run ? 'Simulating removal' : 'Removing') : 'Removal finished'"></span>
                    <span class="num text-gray-500 dark:text-gray-400" x-text="(removalJob?.done || 0) + ' of ' + (removalJob?.total || 0)"></span>
                    <span x-show="removalJob?.failed?.length" class="text-amber-600 dark:text-amber-400" x-text="'· ' + (removalJob?.failed?.length || 0) + ' failed'"></span>
                    <span class="ml-auto text-xs text-gray-500 dark:text-gray-400 truncate max-w-[50%]" x-show="removalJob?.running && removalJob?.current" x-text="removalLabel(removalJob?.current)"></span>
                </div>
                <div class="mt-3 h-2 rounded-full bg-gray-100 dark:bg-gray-700 overflow-hidden">
                    <div class="h-full rounded-full transition-all duration-300"
                         :class="removalJob?.failed?.length ? 'bg-amber-500' : (removalJob?.running ? 'bg-rose-500' : 'bg-emerald-500')"
                         :style="`width:${removalJob?.total ? (removalJob.done / removalJob.total * 100) : 0}%`"></div>
                </div>
                <template x-if="removalJob && !removalJob.running && removalJob.failed?.length">
                    <p class="mt-2 text-xs text-amber-700 dark:text-amber-300" x-text="'Failed: ' + removalJob.failed.map(h => removalLabel(h)).join(', ')"></p>
                </template>
            </div>
        </div>
    </template>
</div>
